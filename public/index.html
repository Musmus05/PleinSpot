<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PleinSpot — Prix des carburants les moins chers autour de vous</title>
    <meta
      name="description"
      content="Comparez en temps réel les prix du gazole, SP95-E10, SP95, SP98, E85 et GPL dans toutes les stations-service de France. Données officielles, carte interactive, horaires et itinéraire en un clic."
    />
    <meta name="theme-color" content="#0A4A8F" />
    <meta name="application-name" content="PleinSpot" />
    <meta name="apple-mobile-web-app-title" content="PleinSpot" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="__ORIGIN__/" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PleinSpot" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="__ORIGIN__/" />
    <meta property="og:title" content="PleinSpot, le carburant le moins cher autour de vous" />
    <meta
      property="og:description"
      content="Tous les prix officiels des stations-service de France sur une carte. Trouvez la station la moins chère autour de vous."
    />
    <meta property="og:image" content="__ORIGIN__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PleinSpot",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Web",
        "inLanguage": "fr-FR",
        "description": "Comparateur des prix des carburants en France à partir des données officielles du ministère de l'Économie.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        overflow: hidden;
        overscroll-behavior: none;
      }

      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      :focus-visible {
        outline: 2px solid #0a4a8f;
        outline-offset: 2px;
      }

      input:focus-visible {
        outline: none;
      }

      ::selection {
        background: #c9daf0;
        color: #16181b;
      }

      input {
        caret-color: #0a4a8f;
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: #b9bebc transparent;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-thumb {
        background: #b9bebc;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      .ps-splash {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }

      .ps-splash svg {
        width: 72px;
        height: 72px;
      }

      .ps-splash span {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 3px solid #e7eef7;
        border-top-color: #0a4a8f;
        animation: ps-spin 0.8s linear infinite;
      }

      @keyframes ps-spin {
        to {
          transform: rotate(360deg);
        }
      }

      #ps-consent {
        position: fixed;
        z-index: 10000;
        left: 16px;
        bottom: 16px;
        max-width: 400px;
        padding: 16px 18px;
        border-radius: 6px;
        background: #ffffff;
        color: #16181b;
        font: 15px/1.5 Barlow_400Regular, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        box-shadow: 0 2px 6px rgba(22, 24, 27, 0.14), 0 10px 28px rgba(22, 24, 27, 0.18);
      }

      #ps-consent[hidden] {
        display: none;
      }

      #ps-consent p {
        margin: 0 0 14px;
      }

      #ps-consent strong {
        font-family: Barlow_600SemiBold, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
      }

      #ps-consent .ps-consent-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      #ps-consent button {
        cursor: pointer;
        min-height: 40px;
        border-radius: 6px;
        padding: 0 16px;
        font: 600 15px Barlow_600SemiBold, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      #ps-consent .ps-consent-refuse {
        border: 1px solid #b9bebc;
        background: #ffffff;
        color: #16181b;
      }

      #ps-consent .ps-consent-refuse:hover {
        background: #f4f5f4;
      }

      #ps-consent .ps-consent-accept {
        border: 0;
        background: #0a4a8f;
        color: #ffffff;
      }

      #ps-consent .ps-consent-accept:hover {
        background: #073a72;
      }

      @media (max-width: 600px) {
        #ps-consent {
          left: 12px;
          right: 12px;
          bottom: calc(12px + env(safe-area-inset-bottom));
          max-width: none;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Pour utiliser PleinSpot, activez JavaScript dans votre navigateur.</noscript>
    <div id="root">
      <div class="ps-splash" aria-label="Chargement de PleinSpot">
        <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <rect width="64" height="64" rx="10" fill="#0A4A8F" />
          <rect x="4.5" y="4.5" width="55" height="55" rx="6.5" stroke="#FFFFFF" stroke-width="3" />
          <path d="M17 49V18.5A3.5 3.5 0 0 1 20.5 15h13A3.5 3.5 0 0 1 37 18.5V49Z" fill="#FFFFFF" />
          <rect x="14" y="46" width="26" height="4.5" rx="1.5" fill="#FFFFFF" />
          <rect x="20.5" y="19.5" width="13" height="8.5" rx="1.5" fill="#008351" />
          <path d="M37 27h3.5a3 3 0 0 1 3 3v9.5a2.75 2.75 0 0 0 5.5 0V25.5l-4.5-5" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span></span>
      </div>
    </div>

    <div id="ps-consent" role="dialog" aria-live="polite" aria-label="Mesure d'audience" hidden>
      <p>
        <strong>PleinSpot utilise Google Analytics</strong> pour mesurer son audience, uniquement si vous l'acceptez.
        Aucune donnée n'est utilisée à des fins publicitaires.
      </p>
      <div class="ps-consent-actions">
        <button type="button" class="ps-consent-refuse" data-consent="denied">Refuser</button>
        <button type="button" class="ps-consent-accept" data-consent="granted">Accepter</button>
      </div>
    </div>

    <script>
      (function () {
        var STORAGE_KEY = 'pleinspot:analytics-consent';
        var GA_ID = 'G-M2T76TW4ZJ';
        var banner = document.getElementById('ps-consent');

        function readChoice() {
          try {
            return localStorage.getItem(STORAGE_KEY);
          } catch (error) {
            return null;
          }
        }

        function saveChoice(choice) {
          try {
            localStorage.setItem(STORAGE_KEY, choice);
          } catch (error) {}
        }

        function loadAnalytics() {
          window['ga-disable-' + GA_ID] = false;

          if (window.gtag) {
            return;
          }

          window.dataLayer = window.dataLayer || [];
          window.gtag = function () {
            window.dataLayer.push(arguments);
          };
          window.gtag('js', new Date());
          window.gtag('config', GA_ID);

          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(script);
        }

        banner.addEventListener('click', function (event) {
          var choice = event.target && event.target.getAttribute('data-consent');

          if (!choice) {
            return;
          }

          saveChoice(choice);
          banner.hidden = true;

          if (choice === 'granted') {
            loadAnalytics();
          } else {
            window['ga-disable-' + GA_ID] = true;
          }
        });

        window.psOpenConsent = function () {
          banner.hidden = false;
        };

        var choice = readChoice();

        if (choice === 'granted') {
          loadAnalytics();
        } else if (choice !== 'denied') {
          banner.hidden = false;
        }
      })();
    </script>
  </body>
</html>
